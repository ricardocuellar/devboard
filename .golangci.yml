version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - gosec
    - misspell
    - revive

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      severity: medium

  exclusions:
    rules:
      - path: "_test.go"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m