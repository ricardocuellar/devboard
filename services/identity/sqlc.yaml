version: "2"
sql:
  - engine: "postgresql"              # motor de base de datos
    queries: "internal/repository/postgres/queries/"
    schema: "migrations/000001_create_users.up.sql"            
    gen:
      go:
        package: "postgres"           
        out: "internal/repository/postgres/generated/" 
        sql_package: "pgx/v5"
        emit_json_tags: true         
        emit_pointers_for_null_types: true 
        emit_empty_slices: true      # []