services:
  # ====
  # Identity
  identity-postgres:
    image: postgres:16-alpine
    container_name: devboard_identity_postgres
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports:
      - "5433:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U identity -d identity" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - identity-data
  redis:
    image: redis:7-alpine
    container_name: devboard_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - identity-data

  identity-migrate:
    image: migrate/migrate:v4.19.1
    container_name: devboard_identity_migrate
    volumes:
      - ./services/identity/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgresql://identity:identity@identity-postgres:5432/identity?sslmode=disable"
      - "up"
    depends_on:
      identity-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - identity-data

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    container_name: devboard_identity
    environment:
      IDENTITY_HTTP_ADDR: ":8081"

      IDENTITY_DATABASE_URL: >-
        postgresql://identity:identity@identity-postgres:5432/identity?sslmode=disable
      REDIS_ADDR: "redis:6379"

      JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "8081:8081"
    depends_on:
      identity-postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      identity-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8081/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app
      - identity-data

  # ====
  # Workspace
  workspace-postgres:
    image: postgres:16-alpine
    container_name: devboard_workspace_postgres
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: workspace
    ports:
      - "5434:5432"
    volumes:
      - workspace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U workspace -d workspace" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - workspace-data

  workspace-migrate:
    image: migrate/migrate:v4.19.1
    container_name: devboard_workspace_migrate
    volumes:
      - ./services/workspace/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgresql://workspace:workspace@workspace-postgres:5432/workspace?sslmode=disable"
      - "up"
    depends_on:
      workspace-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - workspace-data

  workspace:
    build:
      context: .
      dockerfile: services/workspace/Dockerfile
    container_name: devboard_workspace
    environment:
      WORKSPACE_HTTP_ADDR: ":8082"
      WORKSPACE_GRPC_ADDR: ":9092"

      WORKSPACE_DATABASE_URL: >-
        postgresql://workspace:workspace@workspace-postgres:5432/workspace?sslmode=disable
      JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "8082:8082"
      - "9092:9092"
    depends_on:
      workspace-postgres:
        condition: service_healthy

      workspace-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8082/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app
      - workspace-data

  # ====
  # Task
  task-postgres:
    image: postgres:16-alpine
    container_name: devboard_task_postgres
    environment:
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task
      POSTGRES_DB: task
    ports:
      - "5435:5432"
    volumes:
      - task_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U task -d task" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - task-data

  task-migrate:
    image: migrate/migrate:v4.19.1
    container_name: devboard_task_migrate
    volumes:
      - ./services/task/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgresql://task:task@task-postgres:5432/task?sslmode=disable"
      - "up"
    depends_on:
      task-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - task-data

  task:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    container_name: devboard_task
    environment:
      TASK_HTTP_ADDR: ":8083"

      TASK_DATABASE_URL: >-
        postgresql://task:task@task-postgres:5432/task?sslmode=disable
      JWT_SECRET: "${JWT_SECRET}"
      WORKSPACE_GRPC_TARGET: "workspace:9092"
      WORKSPACE_GRPC_TIMEOUT: "1s"
    ports:
      - "8083:8083"
    depends_on:
      task-postgres:
        condition: service_healthy

      task-migrate:
        condition: service_completed_successfully

      workspace:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8083/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app
      - task-data

  # ====
  # Notification
  notification-postgres:
    image: postgres:16-alpine
    container_name: devboard_notification_postgres
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U notification -d notification"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - notification-data

  notification-migrate:
    image: migrate/migrate:v4.19.1
    container_name: devboard_notification_migrate
    volumes:
      - ./services/notification/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgresql://notification:notification@notification-postgres:5432/notification?sslmode=disable"
      - "up"
    depends_on:
      notification-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - notification-data

  notification-consumer:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: devboard_notification_consumer
    environment:
      NOTIFICATION_DATABASE_URL: >-
        postgresql://notification:notification@notification-postgres:5432/notification?sslmode=disable
      NATS_URL: "nats://nats:4222"
    depends_on:
      notification-postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - notification-data
      - messaging

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: devboard_notification
    environment:
      TASK_HTTP_ADDR: ":8084"
      TASK_DATABASE_URL: >-
        postgresql://notification:notification@notification-postgres:5432/notification?sslmode=disable
      JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      notification-postgres:
        condition: service_healthy

      notification-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8084/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - app
      - notification-data

  # Gateway
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: devboard_gateway
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      IDENTITY_HTTP_URL: "http://identity:8081"
      WORKSPACE_HTTP_URL: "http://workspace:8082"
      TASK_HTTP_URL: "http://task:8083"
      GATEWAY_RESPONSE_HEADER_TIMEOUT: "5s"
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - app

  # Nats
  nats:
    image: nats:2.15.1-alpine
    container_name: devboard_nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "-O"
        - "/dev/null"
        - "http://127.0.0.1:8222/healthz"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - messaging

  nats-cli:
    image: natsio/nats-box:0.18.0
    profiles:
      - tools
    entrypoint:
      - nats
    volumes:
      - ./configs/nats:/config:ro
    networks:
      - messaging

  # Outbox task
  task-outbox:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    container_name: devboard_task_outbox
    entrypoint: "/app/outbox"
    environment:
      TASK_DATABASE_URL: >-
        postgresql://task:task@task-postgres:5432/task?sslmode=disable
      NATS_URL: "nats://nats:4222"
    depends_on:
      task-postgres:
        condition: service_healthy

      task-migrate:
        condition: service_completed_successfully

      nats:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - task-data
      - messaging

  # Legacy Database
  postgres:
    image: postgres:16-alpine
    container_name: devboard_postgres
    profiles:
      - legacy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d devboard" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - legacy-data

volumes:
  postgres_data:
  identity_postgres_data:
  workspace_postgres_data:
  task_postgres_data:
  notification_postgres_data:
  redis_data:
  nats_data:

networks:
  app:
  messaging:
  identity-data:
    internal: true

  workspace-data:
    internal: true

  task-data:
    internal: true

  notification-data:
    internal: true

  legacy-data:
    internal: true
