syntax = "proto3";
package devboard.workspace.v1;

option go_package = "github.com/ricardocuellar/devboard/contracts/gen/go/devboard/workspace/v1;";

service WorkspaceService {
  rpc ValidateProjectAccess(ValidateProjectAccessRequest) returns (ValidateProjectAccessResponse);
}

message ValidateProjectAccessRequest {
  string project_id = 1;
  string user_id = 2;
}

message ValidateProjectAccessResponse {
  string workspace_id = 1;
}
