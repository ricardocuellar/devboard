basePath: /api/v1
definitions:
  domain.TaskStatus:
    enum:
    - todo
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusDone
  handler.PaginatedResponse-handler_commentResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.commentResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_memberResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.memberResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_projectResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.projectResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_taskResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.taskResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_workspaceResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.workspaceResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  handler.ProblemDetails:
    properties:
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/validator.ValidationError'
        type: array
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  handler.addMemberRequest:
    properties:
      role:
        enum:
        - admin
        - member
        - viewer
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  handler.assignTaskRequest:
    properties:
      assignee_id:
        type: string
    required:
    - assignee_id
    type: object
  handler.commentResponse:
    properties:
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  handler.createCommentRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  handler.createProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      workspace_id:
        type: string
    required:
    - name
    - workspace_id
    type: object
  handler.createTaskRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      project_id:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - project_id
    - title
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.createWorkspaceRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  handler.healthResponse:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.memberResponse:
    properties:
      id:
        type: string
      joined_at:
        type: string
      role:
        type: string
      user_id:
        type: string
      workspace_id:
        type: string
    type: object
  handler.projectResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      workspace_id:
        type: string
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.registerRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.taskResponse:
    properties:
      assignee_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      project_id:
        type: string
      status:
        $ref: '#/definitions/domain.TaskStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  handler.updateStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.TaskStatus'
    required:
    - status
    type: object
  handler.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  handler.workspaceResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  validator.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Soporte Devboard Ricardo
  description: API REST para gestión de proyectos
  title: Devboard API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifica credenciales y retorna tokens de acceso
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Iniciar sesión
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoca el refresh token del usuario
      parameters:
      - description: Refresh token a revocar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
      summary: Cerrar sesión
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Renueva el par de tokens usando un refresh token válido
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Renovar tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Crea un nuevo usuario y retorna tokens de acceso
      parameters:
      - description: Datos de registro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Registrar usuario
      tags:
      - auth
  /comments/{id}:
    delete:
      description: Elimina un comentario. Solo el author puede borrarlo.
      parameters:
      - description: ID del comentario
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Sin contenido
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Eliminar comentario
      tags:
      - comments
  /health:
    get:
      description: Verifica que el servidor está corriendo y respondiendo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.healthResponse'
      summary: Health check
      tags:
      - system
  /projects:
    post:
      consumes:
      - application/json
      description: Crea un proyecto dentro de un workspace
      parameters:
      - description: Datos del proyecto
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.projectResponse'
      security:
      - BearerAuth: []
      summary: Crear proyecto
      tags:
      - projects
  /projects/{id}:
    get:
      description: Obtiene un proyecto por su ID
      parameters:
      - description: ID del proyecto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.projectResponse'
      security:
      - BearerAuth: []
      summary: Obtener proyecto
      tags:
      - projects
  /projects/{id}/tasks:
    get:
      description: Retorna todas las tareas de un proyecto
      parameters:
      - description: ID del proyecto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Listar tareas del proyecto
      tags:
      - tasks
  /tasks:
    post:
      consumes:
      - application/json
      description: Registra una nueva tarea en el sistema
      parameters:
      - description: Datos de la tarea
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Crear tarea
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Obtiene una tarea por su ID
      parameters:
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Obtener tarea por ID
      tags:
      - tasks
  /tasks/{id}/assign:
    put:
      consumes:
      - application/json
      description: Asigna una tarea a un miembro del equipo
      parameters:
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      - description: ID del asignado
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.assignTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Asignar tarea
      tags:
      - tasks
  /tasks/{id}/comments:
    get:
      description: Lista todos los comentarios de una tarea
      parameters:
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_commentResponse'
      security:
      - BearerAuth: []
      summary: Listar comentarios
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Agrega un comentario a una tarea
      parameters:
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      - description: Contenido
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.commentResponse'
      security:
      - BearerAuth: []
      summary: Crear comentario
      tags:
      - comments
  /tasks/{id}/status:
    put:
      consumes:
      - application/json
      description: Mueve una tarea a un nuevo estado del tablero
      parameters:
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      - description: Nuevo estado
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Actualizar estado de tarea
      tags:
      - tasks
  /users:
    post:
      consumes:
      - application/json
      description: Registra un nuevo usuario en el sistema
      parameters:
      - description: Datos del usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Crear usuario
      tags:
      - users
  /users/{id}:
    get:
      description: Obtiene un usuario por su ID
      parameters:
      - description: ID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Obtener usuario
      tags:
      - users
  /workspaces:
    get:
      description: Lista todos los workspaces donde el usuario autenticado es miembro
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_workspaceResponse'
      security:
      - BearerAuth: []
      summary: Listar mis workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: Crea un nuevo workspace. El creador queda como admin automáticamente.
      parameters:
      - description: Datos del workspace
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.workspaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Crear workspace
      tags:
      - workspaces
  /workspaces/{id}:
    get:
      description: Obtiene un workspace. Solo accesible para miembros.
      parameters:
      - description: ID del workspace
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.workspaceResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Obtener workspace
      tags:
      - workspaces
  /workspaces/{id}/members:
    get:
      description: Lista todos los miembros del workspace
      parameters:
      - description: ID del workspace
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_memberResponse'
      security:
      - BearerAuth: []
      summary: Listar miembros
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: Agrega un usuario al workspace. Solo admins.
      parameters:
      - description: ID del workspace
        in: path
        name: id
        required: true
        type: string
      - description: Datos del miembro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.addMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.memberResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Agregar miembro
      tags:
      - workspaces
  /workspaces/{id}/members/{userID}:
    delete:
      description: Elimina un usuario del workspace. Solo admins.
      parameters:
      - description: ID del workspace
        in: path
        name: id
        required: true
        type: string
      - description: ID del usuario a eliminar
        in: path
        name: userID
        required: true
        type: string
      responses:
        "204":
          description: Sin contenido
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Eliminar miembro
      tags:
      - workspaces
  /workspaces/{id}/projects:
    get:
      description: Lista todos los proyectos de un workspace
      parameters:
      - description: ID del workspace
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_projectResponse'
      security:
      - BearerAuth: []
      summary: Listar proyectos del workspace
      tags:
      - projects
securityDefinitions:
  BearerAuth:
    description: 'Escribe el token con el formato: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
